name: CI Web

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Syntax-check API
        run: node --check server.mjs && node --check auth.mjs
      - name: Check set readiness and offline storage
        run: node scripts/test-set-readiness.mjs && node scripts/test-offline-cache.mjs && node scripts/test-set-autosave.mjs && node scripts/test-isolated-test-target.mjs && node scripts/test-set-api.mjs
      - name: Install browser for offline integration test
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Check offline viewer and set readiness on tablet and phone
        run: node scripts/test-offline-playwright.mjs && node scripts/test-cache-isolation-playwright.mjs
      - name: Install PDF renderer for performance snapshots
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check shared notes and immutable performance versions
        run: node scripts/test-band-performance-api.mjs && node scripts/test-band-performance-playwright.mjs
      - name: Install scan image dependency
        run: python3 -m pip install 'pillow>=10'
      - name: Check document detection, reviewed PDF fidelity and tablet scanner
        run: node scripts/test-live-scan-geometry.mjs && node scripts/test-scan-deskew.mjs && node scripts/test-scan-save-guard.mjs && node scripts/test-scan-quality.mjs && node scripts/test-scan-dialog-playwright.mjs
