name: CI Web

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Syntax-check API
        run: node --check server.mjs && node --check auth.mjs
      - name: Check set readiness and offline storage
        run: node scripts/test-set-readiness.mjs && node scripts/test-offline-cache.mjs
      - name: Install browser for offline integration test
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Check offline viewer and set readiness on tablet and phone
        run: node scripts/test-offline-playwright.mjs
