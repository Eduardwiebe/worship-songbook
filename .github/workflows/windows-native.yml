name: Windows Native

# Builds unsigned Windows NSIS + MSI installers via Tauri 2.
# Does not run automatically on every push — use workflow_dispatch after an approved push.
# Signing secrets are optional and documented in docs/WINDOWS.md.

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri Windows bundles (NSIS + MSI)
        working-directory: app
        # Unsigned smoke / distribution preview. Add signing env later (see docs/WINDOWS.md).
        run: npm run tauri build -- --bundles nsis,msi
        env:
          # Ensure native builds never accidentally bake a relative-only assumption via env.
          # Runtime still detects Tauri and defaults to https://songbook.lyruma.app.
          VITE_API_BASE: https://songbook.lyruma.app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Worship-Songbook-Windows-x64
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
