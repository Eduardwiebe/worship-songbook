<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c192a" />
  <title>Songbook Band – Band beitreten</title>
  <link rel="icon" type="image/png" href="/brand-icon.png?v=3" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f; color: #edf2f7; padding: 24px;
    }
    p { color: #9aadc2; text-align: center; max-width: 28em; line-height: 1.5; }
    a { color: #f1d38d; }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(location.search)
      var code = String(params.get('code') || params.get('join') || '')
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 8)
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true
      try {
        if (code) sessionStorage.setItem('songbook-pending-invite', code)
      } catch (e) {}
      if (code && isStandalone) {
        location.replace('/#/bands?code=' + encodeURIComponent(code))
        return
      }
      if (code) {
        location.replace('/install/?join=' + encodeURIComponent(code))
        return
      }
      location.replace('/install/')
    })()
  </script>
</head>
<body>
  <p>Weiterleitung zur Einladung …<br /><a href="/install/">Songbook installieren</a></p>
</body>
</html>
