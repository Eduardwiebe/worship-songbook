[package]
name = "tauri-plugin-document-scanner"
version = "0.1.0"
description = "Apple VisionKit document scanner for Songbook Band iOS"
authors = ["Eduard Wiebe"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
links = "tauri-plugin-document-scanner"

[package.metadata.platforms.support]
windows = { level = "none", notes = "Fallback to HTML file input" }
linux = { level = "none", notes = "Fallback to HTML file input" }
macos = { level = "none", notes = "Fallback to HTML file input" }
android = { level = "none", notes = "Out of scope; HTML fallback" }
ios = { level = "full", notes = "VNDocumentCameraViewController" }

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3" }
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.11.3", features = ["wry"] }
