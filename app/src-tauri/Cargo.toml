[package]
name = "worship-songbook"
version = "0.1.0"
description = "Worship Songbook – native shell for the web app"
authors = ["Eduard Wiebe"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "worship_songbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
